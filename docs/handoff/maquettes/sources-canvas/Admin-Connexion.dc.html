<style>
body{margin:0;background:#0A0A0C}
*{box-sizing:border-box}
a{color:#E8C877;text-decoration:none}a:hover{color:#EDEDF0}
.display{font-family:'Montserrat','Manrope',system-ui,sans-serif;font-weight:600;letter-spacing:-.01em}
.gold{background:linear-gradient(100deg,#A67C2E 0%,#E8C877 48%,#C9A24A 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.label{font-size:11px;line-height:16px;letter-spacing:.24em;text-transform:uppercase;font-weight:700;color:#8E8E96}
.glass{background:rgba(255,255,255,.06);-webkit-backdrop-filter:blur(28px) saturate(140%);backdrop-filter:blur(28px) saturate(140%);border:1px solid rgba(255,255,255,.10);border-radius:24px;box-shadow:inset 0 1px 0 rgba(232,200,119,.32),0 40px 80px -30px rgba(0,0,0,.8)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:56px;padding:0 26px;border-radius:999px;font:700 15.5px/1 'Manrope',system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.btn-gold{background:linear-gradient(100deg,#A67C2E 0%,#E8C877 50%,#C9A24A 100%);color:#0A0A0C;border:0;box-shadow:0 14px 36px -12px rgba(232,200,119,.55),inset 0 1px 0 rgba(255,255,255,.55)}
.btn-gold:hover{color:#0A0A0C;filter:brightness(1.07)}
.ico{width:20px;height:20px;fill:none;stroke:#D6B467;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bg-sunset{background:#0A0A0C url(../../assets/images/bg-coucher-de-soleil.jpg) center 62%/cover no-repeat}
</style>
</helmet>
<div style="position: relative; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 20px; font-family: 'Manrope', system-ui, sans-serif; color: #EDEDF0; background: #0A0A0C; overflow: hidden; -webkit-font-smoothing: antialiased">
  <div class="bg-sunset" style="position: absolute; inset: 0"></div>
  <div style="position: absolute; inset: 0; background: radial-gradient(60% 70% at 50% 50%, rgba(10,10,12,.35), rgba(10,10,12,.88) 100%)"></div>

  <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 28px; width: 100%; max-width: 460px">
    <div class="glass" style="width: 100%; padding: 44px 40px 36px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 22px">
      <img src="../../assets/images/bp-logo.png" alt="Black Pégasus – American Transports" style="width: 148px; height: 148px; object-fit: contain">
      <div style="display: flex; flex-direction: column; gap: 10px; align-items: center">
        <span class="label" style="color: #E8C877">Espace privé</span>
        <h1 class="display" style="margin: 0; font-size: 30px">Administration</h1>
        <p style="margin: 0; color: #C8C8CC; font-size: 15px; line-height: 1.6; max-width: 320px">Accès réservé aux comptes autorisés de la maison Black Pégasus.</p>
      </div>
      <a class="btn btn-gold" href="Admin-Dashboard.dc.html" style="width: 100%; margin-top: 6px">
        <svg class="ico" viewBox="0 0 24 24" style="stroke: #0A0A0C; width: 22px; height: 22px" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path><path d="M9 11h.01M15 11h.01"></path></svg>
        Se connecter avec Discord
      </a>
      <div style="display: flex; align-items: flex-start; gap: 10px; text-align: left; padding: 14px 16px; border-radius: 14px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08)">
        <svg class="ico" viewBox="0 0 24 24" style="stroke: #C8C8CC; width: 18px; height: 18px; margin-top: 1px" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
        <span style="font-size: 13px; line-height: 1.55; color: #C8C8CC">Votre identifiant Discord doit avoir été ajouté par un administrateur. Aucun mot de passe n’est stocké.</span>
      </div>
    </div>
    <a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; color: #C8C8CC">
      <svg class="ico" viewBox="0 0 24 24" style="stroke: #C8C8CC; width: 18px; height: 18px" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
      Retour au site public
